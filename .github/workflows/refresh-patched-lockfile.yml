name: Refresh Patched Lockfile

on:
  push:
    branches:
      - v1-marketplace-engine
    paths:
      - package.json

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v1-marketplace-engine
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --package-lock-only
      - run: npm audit fix --package-lock-only || true
      - name: Commit lockfile
        run: |
          git config user.name "TakeAChefHome CI"
          git config user.email "actions@users.noreply.github.com"
          git add package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m "Refresh lockfile for patched dependencies"
          git push origin HEAD:v1-marketplace-engine
