name: Refresh Next Lockfile

on:
  push:
    branches:
      - v1-marketplace-engine
    paths:
      - package.json

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: v1-marketplace-engine

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Refresh package lock
        run: npm install next@15.5.23 --save-exact --package-lock-only

      - name: Commit lockfile
        run: |
          git config user.name "TakeAChefHome CI"
          git config user.email "actions@users.noreply.github.com"
          git add package.json package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m "Refresh lockfile for Next.js 15.5.23"
          git push origin HEAD:v1-marketplace-engine
